name: add sbom to releases

on:
  push:
    tags:
      - v*

jobs:
  add_sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLIENT_ID: sfractal2020
      MQTT_HOST: mqtt.sfractal.com
      MQTT_PORT: 1883
      USER_NAME: plug
      PASSWORD: fest
      HIVEMQ_CLIENT_ID: sfractal2020
      HIVEMQ_HOST: hivemq.sfractal.com
      HIVEMQ_PORT: 1883
      HIVEMQ_USER_NAME: hive_plug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install dependencies
        run: mix deps.get

      - name: Generate SBOM
        run: |
          mix sbom.install
          mix sbom.cyclonedx
          mix sbom.convert

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: priv/static/.well-known/sbom/*
