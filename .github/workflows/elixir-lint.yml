name: Elixir CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Run test and check code styles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Check lints
        run: make lint
      - name: Run tests
        run: mix test
        env:
          CLIENT_ID: sfractal2020
          MQTT_HOST: mqtt.sfractal.com
          MQTT_PORT: 1883
          USER_NAME: plug
          PASSWORD: fest
          HIVEMQ_CLIENT_ID: sfractal2020
          HIVEMQ_HOST: hivemq.sfractal.com
          HIVEMQ_PORT: 1883
          HIVEMQ_USER_NAME: hive_plug
